services:
  # S3-compatible object store for MLflow artifacts (replaces MinIO, whose
  # community edition is in maintenance mode).
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    container_name: seaweedfs
    command: mini -dir=/data -bucket=${MLFLOW_S3_BUCKET:-mlflow}
    ports:
      - "8333:8333"   # S3 API
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:-mlflow}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-mlflow-secret}
    volumes:
      - ./data/seaweedfs:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  mlflow:
    # The -full image includes boto3, which the S3 artifact store needs.
    image: ghcr.io/mlflow/mlflow:v3.17.2-full
    container_name: mlflow
    depends_on:
      seaweedfs:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://seaweedfs:8333
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:-mlflow}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-mlflow-secret}
    volumes:
      - ./data/mlflow:/mlflow
    # Artifacts are proxied through the tracking server, so clients only need
    # MLFLOW_TRACKING_URI, not S3 credentials.
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination s3://${MLFLOW_S3_BUCKET:-mlflow}
      --allowed-hosts "localhost:*,127.0.0.1:*,mlflow:*"
